<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Visitor Entry</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
  <h2>New Visitor Entry</h2>
</div>

<div class="container">

  {% if error %}
  <p class="error-msg">{{ error }}</p>
  {% endif %}

  <form method="POST" action="{{ url_for('new_entry') }}">
    <label>Visitor Name:</label>
    <input type="text" name="v_name" required>

    <label>Phone No:</label>
    <input type="text" name="ph_no" required>

    <label>Purpose of Visit:</label>
    <input type="text" name="purpose">

    <label>Person to Meet:</label>
    <input type="text" name="meet_person">

    <label>Vehicle No (if any):</label>
    <input type="text" name="vehicle_no">

    <br><br>
    <button type="submit" class="btn">Submit Entry</button>
  </form>

  <br>
  <a href="{{ url_for('home') }}">Back to Home</a>
</div>

</body>
</html>

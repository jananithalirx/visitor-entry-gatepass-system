<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Records</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
  <h2>All Visitor Records</h2>
</div>

<div class="container">

  <table border="1" cellpadding="6" cellspacing="0">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Purpose</th>
      <th>Meeting</th>
      <th>Vehicle</th>
      <th>In Time</th>
      <th>Out Time</th>
      <th>Date</th>
    </tr>

    {% for row in rows %}
    <tr>
      <td>{{ row[0] }}</td>
      <td>{{ row[1] }}</td>
      <td>{{ row[2] }}</td>
      <td>{{ row[3] }}</td>
      <td>{{ row[4] }}</td>
      <td>{{ row[5] }}</td>
      <td>{{ row[6] }}</td>
      <td>
        {% if row[7] %}
          {{ row[7] }}
        {% else %}
          <span class="pending-tag">Inside</span>
        {% endif %}
      </td>
      <td>{{ row[8] }}</td>
    </tr>
    {% endfor %}
  </table>

  <br>
  <a href="{{ url_for('home') }}">Back to Home</a>
</div>

</body>
</html>
